<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clawd Island</title>
<meta name="theme-color" content="#0d0b0a" data-pwa>
<meta name="apple-mobile-web-app-capable" content="yes" data-pwa>
<meta name="mobile-web-app-capable" content="yes" data-pwa>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" data-pwa>
<meta name="apple-mobile-web-app-title" content="Clawd Island" data-pwa>
<link rel="manifest" href="manifest.webmanifest" data-pwa>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" data-pwa>
<link rel="icon" type="image/png" href="icons/icon-192.png" data-pwa>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: one full-screen scene, like a live wallpaper. A thin clock sits top-left, a horizon line that doubles as the
   timer runs across the lower third, and Clawd walks along it. The island floats on top; everything else hides in a sheet. */
:root{
  color-scheme: dark;
  --ink:#0d0b0a;
  --glass:rgba(28,23,20,.78);
  --line:rgba(255,236,222,.10);
  --line-2:rgba(255,236,222,.18);
  --text:#efe6dd;
  --muted:#8f8177;
  --faint:#5e534c;
  --clay:#d97757;
  --clay-hi:#f2a582;
  --clay-lo:#9b4a32;
  --paper:#f6ede3;
  --paper-ink:#1d1410;
  --outline:#070504;
  --sun:#f5cf6b;
  --mint:#86d0ae;
  --eye:#1b100c;
  --lid:#2c2826;
  --glow:rgba(217,119,87,.16);   /* set from the time of day */

  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
  --font-bubble: "Comic Neue", "Chalkboard SE", "Comic Sans MS", cursive;
  --font-sfx: "Bangers", "Impact", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --spring: cubic-bezier(.32,1.42,.48,1);
  --ease: cubic-bezier(.2,.8,.2,1);
  --horizon: 24%;
  --aw: clamp(112px, 13.5vw, 176px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--ink); color:var(--text); font:15px/1.4 var(--font-ui); overflow:hidden;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
:focus-visible{outline:2px solid var(--clay-hi); outline-offset:3px; border-radius:10px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* ---------- the scene ---------- */
.scene{position:fixed; inset:0; overflow:hidden; isolation:isolate}
.sky{position:absolute; inset:0; z-index:-2; transition:background 4s;
  background:
    radial-gradient(80% 55% at 50% calc(100% - var(--horizon)), var(--glow), transparent 70%),
    linear-gradient(180deg, #0b0908 0%, #110e0c 70%, #0a0807 100%)}
.ground{position:absolute; left:0; right:0; bottom:0; height:var(--horizon); z-index:-1;
  background:linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,.55))}
.horizon{position:absolute; left:0; right:0; bottom:var(--horizon); height:1px; background:var(--line-2); z-index:1}
.horizon i{position:absolute; left:0; top:-.5px; height:2px; width:0; background:var(--clay); box-shadow:0 0 14px rgba(217,119,87,.7);
  transition:width .5s linear, background .4s, opacity .4s; opacity:0}
.horizon.on i{opacity:1}
.horizon.brk i{background:var(--mint); box-shadow:0 0 14px rgba(134,208,174,.6)}

.hero{position:absolute; left:max(7vw, 28px); top:max(15vh, 92px); z-index:2; max-width:calc(100vw - 56px)}
.time{font:200 clamp(92px, 15.5vw, 224px)/.86 var(--font-ui); letter-spacing:-.045em; font-variant-numeric:tabular-nums; color:var(--text)}
.time span{color:var(--muted); font-size:.2em; font-weight:300; letter-spacing:.04em; margin-left:.35em; vertical-align:.25em}
.date{margin-top:18px; font-size:clamp(17px, 1.7vw, 22px); font-weight:400; color:var(--muted); letter-spacing:.005em}
.nowline{margin-top:22px; display:flex; align-items:center; gap:10px; max-width:min(620px, 84vw); text-align:left;
  font:400 clamp(13px, 1.15vw, 15px)/1.3 var(--font-mono); color:var(--muted); padding:8px 12px 8px 0; border-radius:10px}
.nowline .spin-glyph{color:var(--clay); width:1.1em; text-align:center; flex:none}
.nowline .verb{color:var(--clay-hi); flex:none}
.nowline .task{color:var(--text); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.nowline .dot{color:var(--faint); flex:none}
.shimmer{background:linear-gradient(90deg, var(--clay) 0%, var(--clay) 35%, #ffd9c6 50%, var(--clay) 65%, var(--clay) 100%) 0 0/250% 100%;
  -webkit-background-clip:text; background-clip:text; color:transparent; animation:shimmer 2.2s linear infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-150% 0}}

/* corner chrome: fades away when you leave it alone */
.chrome{transition:opacity .8s var(--ease)}
body.ambient .chrome{opacity:0}
.tools{position:absolute; z-index:4; top:calc(env(safe-area-inset-top,0px) + 14px); right:max(18px, env(safe-area-inset-right,0px)); display:flex; gap:6px}
.tool{width:38px; height:38px; border-radius:50%; display:grid; place-items:center; color:var(--faint); transition:color .2s, background .2s, transform .25s var(--spring)}
.tool:hover{background:rgba(255,255,255,.05)}
.tool:active{transform:scale(.88)}
.tool[aria-pressed="true"]{color:var(--clay-hi)}
.tool svg{width:19px; height:19px}
.foot{position:absolute; z-index:4; left:max(7vw, 28px); right:max(5vw, 20px); bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
  display:flex; justify-content:space-between; align-items:center; gap:12px; font:400 12px/1 var(--font-mono); color:var(--faint); font-variant-numeric:tabular-nums}
.foot b{color:var(--muted); font-weight:500}
.open-sheet{display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 16px; border-radius:20px; border:1px solid var(--line-2);
  font:500 13px/1 var(--font-ui); color:var(--text); background:rgba(255,255,255,.03); transition:transform .25s var(--spring), background .2s}
.open-sheet:active{transform:scale(.94)}
.open-sheet svg{width:15px; height:15px}
.open-sheet .count{font:500 11px/1 var(--font-mono); color:var(--clay-hi)}

/* ---------- Dynamic Island ---------- */
.island{position:fixed; z-index:50; top:calc(env(safe-area-inset-top,0px) + 11px); left:50%;
  width:200px; height:37px; transform:translateX(-50%); transition:width .62s var(--spring), height .62s var(--spring); cursor:pointer}
.island.live{width:292px}
.island[data-mode="alert"]{width:min(420px, calc(100vw - 28px)); height:78px}
.island[data-mode="expanded"]{width:min(620px, calc(100vw - 24px)); height:206px; cursor:default}
.shapes-wrap{position:absolute; inset:-34px -90px; pointer-events:none; filter:drop-shadow(0 10px 24px rgba(0,0,0,.6))}
.island.glow .shapes-wrap{filter:drop-shadow(0 0 18px rgba(217,119,87,.5)) drop-shadow(0 10px 24px rgba(0,0,0,.6))}
.shapes{position:absolute; inset:0; filter:url(#goo)}
.s-main,.s-bud{position:absolute; background:#000}
.s-main{left:90px; right:90px; top:34px; bottom:34px; border-radius:19px; transition:border-radius .5s var(--ease)}
.island[data-mode="alert"] .s-main,.island[data-mode="alert"] .i-main{border-radius:32px}
.island[data-mode="expanded"] .s-main,.island[data-mode="expanded"] .i-main{border-radius:46px}
.s-bud{top:34px; width:37px; height:37px; border-radius:50%; left:calc(100% - 90px - 40px); transform:scale(.6); transition:left .62s var(--spring), transform .62s var(--spring)}
.island.split .s-bud{left:calc(100% - 90px + 10px); transform:scale(1)}
.i-main{position:absolute; inset:0; overflow:hidden; border-radius:19px; transition:border-radius .5s var(--ease); box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.i-bud{position:absolute; top:0; left:calc(100% + 10px); width:37px; height:37px; display:grid; place-items:center; opacity:0; transform:scale(.4);
  transition:opacity .25s, transform .55s var(--spring); pointer-events:none}
.island.split .i-bud{opacity:1; transform:scale(1); transition-delay:.12s}
.i-bud svg{position:absolute; inset:5px; width:27px; height:27px; transform:rotate(-90deg)}
.i-bud .spin-glyph{font-size:12px; color:var(--clay)}
.island.brk .i-bud .spin-glyph{color:var(--mint)}
.view{position:absolute; inset:0; opacity:0; transform:scale(.9); filter:blur(5px); pointer-events:none; transition:opacity .22s, transform .45s var(--spring), filter .22s}
.island[data-mode="compact"] .v-compact,.island[data-mode="alert"] .v-alert,.island[data-mode="expanded"] .v-expanded{opacity:1; transform:none; filter:none; pointer-events:auto; transition-delay:.14s}
.v-compact{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:0 15px 0 11px; color:#fff}
.v-compact .left{display:flex; align-items:center; gap:8px; min-width:0}
.v-compact .clawd{width:26px; flex:none}
.ic-label{font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#e9dfd6}
.ic-right{display:flex; align-items:center; gap:5px; font:700 13.5px/1 var(--font-mono); font-variant-numeric:tabular-nums}
.ic-right .spin-glyph{color:var(--clay)}
.island.live .ic-right{color:var(--clay-hi)}
.island.brk .ic-right{color:var(--mint)}
.v-alert{display:flex; align-items:center; gap:14px; padding:0 22px 0 16px; color:#fff}
.v-alert .clawd{width:56px; flex:none}
.ia-text{min-width:0; flex:1}
.ia-title{font:700 11px/1 var(--font-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--clay-hi); display:flex; gap:6px; align-items:center}
.ia-msg{margin-top:5px; font-size:15px; font-weight:600; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ia-sfx{font:25px/1 var(--font-sfx); color:var(--sun); letter-spacing:.04em; transform:rotate(-8deg); flex:none}
.v-expanded{display:grid; grid-template-columns:auto minmax(0,1fr) auto; grid-template-rows:1fr auto; gap:10px 18px; padding:22px 26px 20px; color:#fff}
.v-expanded .clawd{width:76px; align-self:center}
.ie-info{min-width:0; align-self:center}
.ie-verb{font:700 12px/1 var(--font-mono); display:flex; gap:6px; align-items:center}
.ie-verb .spin-glyph{color:var(--clay)}
.island.brk .ie-verb .spin-glyph{color:var(--mint)}
.ie-title{margin-top:9px; font-size:21px; font-weight:700; letter-spacing:-.015em; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ie-sub{margin-top:4px; font-size:13px; color:#a99a8e}
.ie-ring{position:relative; width:82px; height:82px; align-self:center}
.ie-ring svg{width:100%; height:100%; transform:rotate(-90deg)}
.ie-time{position:absolute; inset:0; display:grid; place-items:center; font:700 17px/1 var(--font-mono); font-variant-numeric:tabular-nums}
.ie-actions{grid-column:1/-1; display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
.ibtn{height:38px; padding:0 15px; border-radius:19px; background:#1d1d1f; color:#f2f2f2; font-size:14px; font-weight:600; display:inline-flex; align-items:center; gap:7px; transition:transform .25s var(--spring)}
.ibtn:active{transform:scale(.92)}
.ibtn svg{width:15px; height:15px}
.ibtn.primary{background:var(--clay); color:#1a0e09}
.island.brk .ibtn.primary{background:var(--mint)}
.ibtn:disabled{opacity:.35; pointer-events:none}
.ring-track{fill:none; stroke:rgba(255,255,255,.12)}
.ring-prog{fill:none; stroke:var(--clay); stroke-linecap:round; transition:stroke-dasharray .4s linear, stroke .3s, opacity .3s}
.brk .ring-prog{stroke:var(--mint)}
.ring-prog.zero{opacity:0}

/* ---------- Clawd ---------- */
.clawd{display:block; overflow:visible; height:auto}
.clawd .shell,.clawd .arm,.clawd .leg{fill:var(--clay)}
.clawd .shell-hi{fill:var(--clay-hi); opacity:.55}
.clawd .shell-lo{fill:var(--clay-lo); opacity:.6}
.clawd .eye-open rect{fill:var(--eye)}
.clawd .eye-happy path,.clawd .eye-shut path{fill:none; stroke:var(--eye); stroke-width:.75; stroke-linecap:round; stroke-linejoin:round}
.clawd .eye-happy,.clawd .eye-shut,.clawd .prop{display:none}
.clawd .eye-open{transform-box:fill-box; transform-origin:center; animation:blink 5.2s infinite}
.clawd .eyes{transition:transform .35s var(--ease)}
.clawd .c-torso{animation:bob 2.6s ease-in-out infinite}
.clawd .lid{fill:var(--lid)} .clawd .base{fill:#3d3835}
.clawd .lid-logo path{stroke:var(--clay-hi); stroke-width:.42; stroke-linecap:round; fill:none}
.clawd .lid-logo{animation:pulse 1.6s ease-in-out infinite}
.clawd .mug-body,.clawd .mug-handle{fill:var(--paper)}
.clawd .steam{fill:rgba(255,240,230,.55); animation:steam 1.8s ease-in infinite}
.clawd .steam.s2{animation-delay:-.9s}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.1)}}
@keyframes bob{50%{transform:translateY(.32px)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes steam{0%{transform:translateY(0); opacity:0}30%{opacity:1}100%{transform:translateY(-1.6px); opacity:0}}
.typing .arm-l{animation:tap .22s steps(1) infinite}
.typing .arm-r{animation:tap .22s steps(1) infinite -.11s}
@keyframes tap{50%{transform:translateY(.7px)}}
.walk .leg.la{animation:step .34s steps(1) infinite}
.walk .leg.lb{animation:step .34s steps(1) infinite -.17s}
.walk .c-torso{animation:walkbob .17s steps(1) infinite}
@keyframes step{50%{transform:translateY(-.8px)}}
@keyframes walkbob{50%{transform:translateY(-.3px)}}
.wave .arm-r{animation:wave .46s ease-in-out 4}
@keyframes wave{50%{transform:translate(.3px,-2.8px)}}
.happy .eye-open{display:none} .happy .eye-happy{display:inline}
.sleep .eye-open{display:none} .sleep .eye-shut{display:inline}
.sleep .c-torso{animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(.55px)}}
.surprised .eye-open{transform:scaleY(1.35) scaleX(1.3); animation:none}
.think .eyes{transform:translate(.7px,-.8px)}
.look-l .eyes{transform:translateX(-.9px)}
.look-r .eyes{transform:translateX(.9px)}
.has-laptop .laptop{display:inline}
.has-mug .mug{display:inline}
.has-mug .arm-r,.has-mug .mug{animation:sip 5s ease-in-out infinite}
@keyframes sip{0%,70%,100%{transform:none}78%,90%{transform:translate(-.4px,-1.4px)}}
.hop .c-all{animation:hop .6s cubic-bezier(.3,.7,.4,1)}
@keyframes hop{0%{transform:none}38%{transform:translateY(-3.4px)}68%{transform:none}82%{transform:translateY(-.7px)}100%{transform:none}}

.actor{position:absolute; left:0; bottom:calc(var(--horizon) - var(--aw) * .045); width:var(--aw); z-index:3; will-change:transform; cursor:pointer; touch-action:manipulation}
.actor .clawd{width:100%}
.actor .shadow{position:absolute; left:18%; right:18%; bottom:calc(var(--aw) * .025); height:calc(var(--aw) * .05); border-radius:50%;
  background:radial-gradient(closest-side, rgba(0,0,0,.7), transparent); z-index:-1}
.actor .reflect{position:absolute; left:0; right:0; top:calc(100% - var(--aw) * .09); height:100%; overflow:hidden; opacity:.1; transform:scaleY(-1);
  -webkit-mask:linear-gradient(to top, #000, transparent 70%); mask:linear-gradient(to top, #000, transparent 70%); pointer-events:none}
.actor.hop .shadow{animation:shadowhop .6s cubic-bezier(.3,.7,.4,1)}
@keyframes shadowhop{38%{transform:scale(.6); opacity:.5}}
.zz{position:absolute; font:20px/1 var(--font-sfx); color:var(--muted); pointer-events:none; animation:zz 2.6s ease-out forwards; z-index:4}
@keyframes zz{0%{opacity:0; transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0; transform:translate(28px,-64px) scale(1.4) rotate(14deg)}}
.emote{position:absolute; font:38px/1 var(--font-sfx); color:var(--sun); pointer-events:none; z-index:4; animation:emote 1.3s var(--spring) forwards}
@keyframes emote{0%{opacity:0; transform:translateY(10px) scale(.3)}25%{opacity:1; transform:translateY(0) scale(1.1)}80%{opacity:1}100%{opacity:0; transform:translateY(-12px)}}

/* bubbles: still comic, just quieter */
.bubble{position:absolute; z-index:5; left:0; bottom:0; max-width:min(320px, calc(100vw - 32px)); width:max-content;
  padding:11px 16px 12px; color:var(--paper-ink); background:var(--paper); border:2.5px solid var(--outline); border-radius:20px;
  box-shadow:0 12px 30px rgba(0,0,0,.35);
  font:700 clamp(15px, 1.5vw, 18px)/1.28 var(--font-bubble);
  transform-origin:var(--tail, 50%) 120%; animation:bubblein .42s var(--spring)}
.bubble.out{animation:bubbleout .2s ease-in forwards}
@keyframes bubblein{from{transform:scale(.2) rotate(-5deg); opacity:0}}
@keyframes bubbleout{to{transform:scale(.6); opacity:0}}
.bubble .ghost{visibility:hidden}
.bubble .tail{position:absolute; left:calc(var(--tail, 50%) - 10px); bottom:-19px; width:26px; height:20px; overflow:visible}
.bubble .tail .f{fill:var(--paper)}
.bubble .tail .s{fill:none; stroke:var(--outline); stroke-width:2.5; stroke-linejoin:round}
.bubble .tdots{display:none}
.bubble.thought{border-radius:999px; font:500 clamp(13px,1.2vw,15px)/1.25 var(--font-mono); padding:10px 18px; background:rgba(246,237,227,.94)}
.bubble.thought .spin-glyph{color:var(--clay)}
.bubble.thought .tail{display:none}
.bubble.thought .tdots{display:block}
.bubble .tdots i{position:absolute; border:2.5px solid var(--outline); background:var(--paper); border-radius:50%}
.bubble .tdots i:nth-child(1){width:15px; height:15px; left:calc(var(--tail,50%) - 8px); bottom:-22px}
.bubble .tdots i:nth-child(2){width:9px; height:9px; left:calc(var(--tail,50%) - 2px); bottom:-36px}

.burst{position:absolute; z-index:7; width:var(--bw,150px); aspect-ratio:1.45; display:grid; place-items:center; pointer-events:none; animation:burst 1.7s var(--spring) forwards}
.burst .b-ink,.burst .b-fill{position:absolute; inset:0; clip-path:var(--star)}
.burst .b-ink{background:var(--outline)}
.burst .b-fill{inset:5px; background:var(--sun)}
.burst .b-word{position:relative; font:clamp(22px, 2.4vw, 32px)/1 var(--font-sfx); letter-spacing:.04em; color:var(--clay); -webkit-text-stroke:1.2px var(--outline); text-shadow:2px 2px 0 var(--outline)}
@keyframes burst{0%{transform:scale(0) rotate(var(--r,-8deg))}18%{transform:scale(1.12) rotate(var(--r,-8deg))}30%{transform:scale(1) rotate(var(--r,-8deg))}80%{opacity:1}100%{opacity:0; transform:scale(1.05) rotate(var(--r,-8deg))}}
.bit{position:absolute; z-index:6; pointer-events:none; font:700 18px/1 var(--font-mono); animation:bit 1.4s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes bit{0%{transform:translate(0,0) rotate(0) scale(.4); opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1); opacity:0}}
.flare{position:absolute; left:0; right:0; bottom:var(--horizon); height:2px; z-index:1; pointer-events:none; opacity:0;
  background:radial-gradient(closest-side, var(--clay-hi), transparent); }
.flare.go{animation:flare 1.6s ease-out}
@keyframes flare{0%{opacity:0; transform:scaleX(.1)}20%{opacity:1}100%{opacity:0; transform:scaleX(1.2)}}

/* ---------- sheet ---------- */
.scrim{position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.35); opacity:0; pointer-events:none; transition:opacity .35s}
body.sheet-open .scrim{opacity:1; pointer-events:auto}
.sheet{position:fixed; z-index:30; left:50%; bottom:0; width:min(560px, 100vw); max-height:min(78vh, 680px);
  transform:translate(-50%, 104%); transition:transform .5s var(--spring);
  display:flex; flex-direction:column; padding:10px 22px calc(env(safe-area-inset-bottom,0px) + 20px);
  background:var(--glass); -webkit-backdrop-filter:blur(28px) saturate(1.2); backdrop-filter:blur(28px) saturate(1.2);
  border:1px solid var(--line); border-bottom:0; border-radius:28px 28px 0 0; user-select:text; -webkit-user-select:text}
body.sheet-open .sheet{transform:translate(-50%, 0)}
.grab{width:40px; height:5px; border-radius:3px; background:var(--line-2); margin:0 auto 14px; flex:none}
.timer-row{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.t-time{font:300 40px/1 var(--font-ui); letter-spacing:-.03em; font-variant-numeric:tabular-nums; min-width:3.2ch}
.seg{display:flex; padding:3px; gap:2px; background:rgba(0,0,0,.3); border-radius:11px; margin-left:auto}
.seg button{padding:6px 10px; border-radius:8px; font-size:12.5px; font-weight:600; color:var(--muted)}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.09); color:var(--text)}
.t-btns{display:flex; gap:8px; width:100%}
.btn{height:42px; padding:0 16px; border-radius:21px; background:rgba(255,255,255,.07); font-size:14px; font-weight:600;
  display:inline-flex; align-items:center; justify-content:center; gap:7px; transition:transform .25s var(--spring)}
.btn:active{transform:scale(.94)}
.btn svg{width:15px; height:15px}
.btn.primary{background:var(--clay); color:#1a0e09; flex:1}
.btn.primary.brk{background:var(--mint)}
.sec{margin-top:18px; padding-top:14px; border-top:1px solid var(--line); display:flex; flex-direction:column; min-height:0; flex:1}
.sec-h{display:flex; justify-content:space-between; align-items:baseline; font:500 11px/1 var(--font-mono); letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.add{display:flex; gap:8px; margin-top:12px}
.add input{flex:1; min-width:0; height:44px; border-radius:14px; border:1px solid var(--line); background:rgba(0,0,0,.25); color:var(--text); padding:0 14px; font:16px var(--font-ui)}
.add input::placeholder{color:var(--faint)}
.add input:focus{outline:none; border-color:var(--clay)}
.add .btn{background:var(--clay); color:#1a0e09}
.list{list-style:none; margin:10px -6px 0; padding:0 6px; overflow:auto; min-height:60px; flex:1; display:flex; flex-direction:column; gap:2px}
.item{display:flex; align-items:center; gap:12px; padding:8px 8px; border-radius:12px}
.item.now{background:rgba(217,119,87,.11)}
.item.enter{animation:enter .45s var(--spring)}
@keyframes enter{from{transform:translateY(-8px) scale(.97); opacity:0}}
.check{width:24px; height:24px; flex:none; border-radius:50%; border:1.5px solid var(--faint); display:grid; place-items:center; transition:background .2s, border-color .2s, transform .3s var(--spring)}
.check svg{width:13px; height:13px; opacity:0; transform:scale(.4); transition:opacity .2s, transform .35s var(--spring)}
.item.done .check{background:var(--clay); border-color:var(--clay)}
.item.done .check svg{opacity:1; transform:none}
.check:active{transform:scale(.85)}
.item-text{flex:1; min-width:0; font-size:15px; overflow-wrap:anywhere}
.item.done .item-text{color:var(--faint); text-decoration:line-through}
.pin{font:500 10px/1 var(--font-mono); letter-spacing:.12em; padding:6px 8px; border-radius:7px; color:var(--faint)}
.item.now .pin{color:var(--clay-hi)}
.item.done .pin{display:none}
.del{width:28px; height:28px; border-radius:8px; display:grid; place-items:center; color:var(--faint)}
.del svg{width:13px; height:13px}
.empty{padding:16px 4px; color:var(--muted); font-size:14px}
.sheet-foot{display:flex; justify-content:space-between; gap:10px; margin-top:10px; font:400 12px/1.3 var(--font-mono); color:var(--faint)}
.sheet-foot button{color:var(--clay-hi); font:500 12px var(--font-ui)}

/* iPhone with a real Dynamic Island (Home Screen app, portrait): Clawd's island wraps around the camera cutout.
   The cutout sits in the middle of the pill, so content lives in the two lobes on either side, like a Live Activity. */
.hw-island .island{top:10px; width:190px; height:41px}
.hw-island .island.live{width:226px}
.hw-island .island[data-mode="alert"]{width:min(372px, calc(100vw - 16px)); height:104px}
.hw-island .island[data-mode="expanded"]{width:min(372px, calc(100vw - 16px)); height:236px}
.hw-island .s-main,.hw-island .i-main{border-radius:21px}
.hw-island .island[data-mode="alert"] .s-main,.hw-island .island[data-mode="alert"] .i-main{border-radius:38px}
.hw-island .island[data-mode="expanded"] .s-main,.hw-island .island[data-mode="expanded"] .i-main{border-radius:46px}
.hw-island .ic-label{display:none}
.hw-island .v-compact{padding:0 13px 0 12px}
.hw-island .v-compact .clawd{width:24px}
.hw-island .ic-right{font-size:12px}
.hw-island .island:not(.live) #icRight{display:none}
.hw-island .v-alert{padding:42px 20px 10px 16px}
.hw-island .v-alert .clawd{width:48px}
.hw-island .v-expanded{padding:52px 20px 18px; gap:10px 14px}
.hw-island .v-expanded .clawd{width:58px}
.hw-island .ie-ring{width:66px; height:66px}
.hw-island .ie-title{font-size:18px}
.hw-island .ibtn{padding:0 12px; font-size:13px}

@media (max-aspect-ratio: 1/1){ /* portrait */
  :root{--horizon:30%; --aw:clamp(112px, 22vw, 190px)}
  .hero{top:max(14vh, 96px)}
  .time{font-size:clamp(92px, 24vw, 230px)}
}
@media (max-width: 520px){
  .hero{left:22px}
  .foot .stats{display:none}
  .island[data-mode="expanded"]{height:234px}
  .v-expanded{padding:18px 18px 16px; gap:8px 12px}
  .v-expanded .clawd{width:58px}
  .ie-ring{width:68px; height:68px}
  .ie-title{font-size:18px}
  .ibtn{padding:0 12px; font-size:13px}
  .island.live{width:min(292px, calc(100vw - 96px))}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
}

<script>
(() => {
'use strict';
/* ================= utilities ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const pick = a => a[Math.floor(Math.random() * a.length)];
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const pad = n => String(n).padStart(2, '0');
const fmt = s => { s = Math.max(0, Math.ceil(s)); return `${Math.floor(s / 60)}:${pad(s % 60)}`; };
const trim = (s, n) => s.length > n ? s.slice(0, n - 1) + '…' : s;
const dayKey = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const store = {
  get(k, d) { try { const v = localStorage.getItem('clawd-island.' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('clawd-island.' + k, JSON.stringify(v)); } catch {} }
};

/* ================= Clawd sprite ================= */
function clawdSVG(props) {
  const vb = props ? '-2 -3 22 14' : '0.4 -0.8 17.2 11.6';
  const extras = props ? `
    <g class="prop laptop"><rect class="lid" x="3.5" y="4.4" width="11" height="4.6" rx=".35"/>
      <g class="lid-logo" shape-rendering="geometricPrecision"><path d="M9 5.75v1.9M8.05 6.7h1.9M8.33 6.03l1.34 1.34M9.67 6.03 8.33 7.37"/></g>
      <rect class="base" x="2" y="9" width="14" height=".8" rx=".3"/></g>
    <g class="prop mug"><rect class="mug-body" x="17.2" y="3.4" width="2" height="2.3"/><rect class="mug-handle" x="19.2" y="3.9" width=".6" height="1.2"/>
      <rect class="steam" x="17.7" y="1.9" width=".4" height="1"/><rect class="steam s2" x="18.5" y="1.2" width=".4" height="1"/></g>` : '';
  return `<svg class="clawd" viewBox="${vb}" shape-rendering="crispEdges" aria-hidden="true" focusable="false"><g class="c-all">
    <g class="c-legs"><rect class="leg la" x="4" y="8" width="1" height="2"/><rect class="leg lb" x="6" y="8" width="1" height="2"/><rect class="leg la" x="11" y="8" width="1" height="2"/><rect class="leg lb" x="13" y="8" width="1" height="2"/></g>
    <g class="c-torso">
      <rect class="arm arm-l" x="1" y="4" width="2" height="2"/><rect class="arm arm-r" x="15" y="4" width="2" height="2"/>
      <rect class="shell" x="3" y="0" width="12" height="8"/><rect class="shell-hi" x="3" y="0" width="12" height=".7"/><rect class="shell-lo" x="3" y="7.3" width="12" height=".7"/>
      <g class="eyes">
        <g class="eye-open"><rect x="5" y="2" width="1" height="2"/><rect x="12" y="2" width="1" height="2"/></g>
        <g class="eye-happy" shape-rendering="geometricPrecision"><path d="M4.6 3.6 5.5 2.5 6.4 3.6M11.6 3.6 12.5 2.5 13.4 3.6"/></g>
        <g class="eye-shut" shape-rendering="geometricPrecision"><path d="M4.4 3.3H6.6M11.4 3.3H13.6"/></g>
      </g>
    </g>${extras}</g></svg>`;
}
$$('[data-clawd]').forEach(el => { el.outerHTML = clawdSVG(el.dataset.clawd === 'stage').replace('<svg class="clawd"', `<svg class="clawd"${el.id ? ` id="${el.id}"` : ''}`); });
const stageClawd = $('#actor .clawd');
const miniClawds = ['#icClawd', '#iaClawd', '#ieClawd'].map(s => $(s));
// faint reflection on the horizon: a live mirror of Clawd
$('#actor .reflect').innerHTML = clawdSVG(true);
const reflectClawd = $('#actor .reflect .clawd');

/* ================= Claude spinner + verbs ================= */
const FRAMES = ['·', '✢', '✳︎', '✶', '✻', '✽', '✻', '✶', '✳︎', '✢'];
const VERBS = ['Clauding', 'Pondering', 'Noodling', 'Percolating', 'Tinkering', 'Simmering', 'Ruminating', 'Wrangling', 'Brewing',
  'Cogitating', 'Finagling', 'Moseying', 'Puttering', 'Spelunking', 'Whirring', 'Shimmying', 'Concocting', 'Forging', 'Vibing', 'Herding bits'];
let frame = 0, verb = 'Clauding';
setInterval(() => { frame = (frame + 1) % FRAMES.length; for (const el of document.getElementsByClassName('spin-glyph')) el.textContent = FRAMES[frame]; }, 115);
function newVerb() { verb = pick(VERBS); $$('.verb').forEach(el => el.textContent = verb + '…'); }
setInterval(newVerb, 5200); newVerb();

/* ================= lines ================= */
const LINES = {
  morning: ['Morning! What are we shipping today?', 'Good morning. Coffee first, then greatness.'],
  afternoon: ['Afternoon! Let\'s knock out the next thing.', 'Post-lunch slump? One small task. Go.'],
  evening: ['Evening shift. Let\'s wrap up something nice.', 'Still here? Pick one thing and finish it.'],
  night: ['It\'s late. One last thing, then sleep?', 'Night owl mode. I brought snacks. (I did not.)'],
  tips: [
    'One task at a time. I only have two arms. Well, nubs.',
    'Hydrate! Crabs need water. So do you.',
    'Small commits, big wins.',
    'Write it down. Your brain is for thinking, not storing.',
    'Stuck? Explain it to me. I\'m a great rubber duck. Er, crab.',
    'Break it into smaller pieces. Then smaller.',
    'Done is better than perfect.',
    'Shoulders down. Unclench the jaw. Better.',
    'Close a tab. You know which one.',
    'Future you will thank present you.'
  ],
  tap: ['Hey! That tickles.', 'Boop received.', '*happy crab noises*', 'Tap the island up top!', 'I\'m on it. Probably.', 'Hi hi hi!'],
  focusStart: ['Focus mode on. I\'ll guard the door.', 'Heads down. I\'ll keep the vibes warm.', 'Okay, quiet time. Let\'s cook.'],
  half: ['Halfway there. You\'re doing great.', 'Half done! Keep going.'],
  last: ['Five minutes left. Final sprint!', 'Almost there. Bring it home.'],
  focusDone: ['Session complete! Go take a break.', 'That\'s a wrap on that round. Stretch!'],
  breakStart: ['Stretch, sip, breathe. I\'ll be here.', 'Break time. Look at something far away.'],
  breakDone: ['Break\'s over. Ready for another round?', 'Recharged? Let\'s go again.'],
  paused: ['Paused. I\'ll keep your seat warm.', 'Taking a sec? Cool.'],
  taskDone: ['Task shipped!', 'Another one down!', 'Look at you go!', 'Shipped it. Chef\'s kiss.'],
  allDone: ['Everything\'s checked off. Legendary.', 'List cleared! Victory lap time.'],
  added: ['Added. We\'ve got this.', 'On the list. Noted.', 'Ooh, a new quest.'],
  wake: ['Oh! I was just… resting my eyes.', 'Huh? I\'m up! I\'m up!']
};
const SFX = { done: ['SHIPPED!', 'BOOM!', 'NAILED IT!', 'DONE!'], focus: ['FOCUS!', 'LOCK IN!'], break: ['BREAK!', 'PHEW!'], tap: ['BOOP!', 'HI!', 'EEP!'] };

/* ================= state ================= */
const MODES = { focus: { label: 'Focus', min: 25 }, short: { label: 'Break', min: 5 }, long: { label: 'Long break', min: 15 } };
const prefs = Object.assign({ sound: true, awake: false }, store.get('prefs', {}));
let tasks = store.get('tasks', null);
if (!tasks) tasks = [
  { id: 1, text: 'Pick today\'s top 3', done: false, now: true },
  { id: 2, text: 'Clear the inbox for 15 minutes', done: false },
  { id: 3, text: 'Deep work on the big thing', done: false }
];
let stats = store.get('stats', {});
if (stats.day !== dayKey()) stats = { day: dayKey(), sessions: 0, minutes: 0, shipped: 0 };
let T = Object.assign({ mode: 'focus', total: 1500, remaining: 1500, running: false, endAt: 0, round: 0, flags: {} }, store.get('timer', {}));
const save = () => { store.set('tasks', tasks); store.set('stats', stats); store.set('timer', T); store.set('prefs', prefs); };

/* ================= audio ================= */
let actx = null;
function ensureAudio() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch {} }
function chime(kind) {
  if (!prefs.sound || !actx) return;
  const seq = { done: [659.25, 783.99, 1046.5], soft: [523.25, 659.25], pop: [880, 1318.5], start: [392, 523.25] }[kind] || [660];
  seq.forEach((f, i) => {
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * .12;
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.14, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + .7);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + .75);
  });
}

/* ================= scene + actor ================= */
const scene = $('#scene'), actorEl = $('#actor'), bubble = $('#bubble'), bubbleText = $('#bubbleText');
const A = { x: .62, tx: .62, walking: false, dir: 1, scene: 'idle', onArrive: null };
let lastTouch = Date.now();
function dims() {

  // horizon = timer
  const hz = $('#horizon'); hz.classList.toggle('on', T.running || prog > .4); hz.classList.toggle('brk', brk);
  hz.firstElementChild.style.width = prog.toFixed(2) + '%';
  // hero line
  $('#nowTask').textContent = T.running ? `${fmt(rem)} left · ${brk ? MODES[T.mode].label.toLowerCase() : (ct ? ct.text : 'focus')}` : (ct ? ct.text : 'add a task');
  $('#stats').innerHTML = `today · <b>${stats.sessions}</b> session${stats.sessions === 1 ? '' : 's'} · <b>${stats.minutes}</b> min · <b>${stats.shipped}</b> shipped`;
  // sheet
  $('#tTime').textContent = fmt(rem);
  const bt = $('#bToggle'), label = T.running ? 'Pause' : (rem < T.total - 1 ? 'Resume' : brk ? 'Start break' : 'Start focus');
  if (bt.dataset.l !== label) { bt.dataset.l = label; bt.innerHTML = (T.running ? ICON_PAUSE : ICON_PLAY) + label; }
  bt.classList.toggle('brk', brk);
  $$('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === T.mode));
  // island
  const live = T.running && island.dataset.mode === 'compact';
  island.classList.toggle('live', live); island.classList.toggle('split', live && !hwIsland()); island.classList.toggle('brk', brk);
  $('#icLabel').textContent = T.running ? (brk ? MODES[T.mode].label : (ct ? ct.text : 'Focus')) : '';
  $('#icRight').textContent = T.running ? fmt(rem) : hm;
  ['#ibProg', '#ieProg'].forEach(s => { const c = $(s); c.setAttribute('stroke-dasharray', `${prog.toFixed(2)} 100`); c.classList.toggle('zero', prog < .4); });
  $('#ieTime').textContent = fmt(rem);
  $('#ieTitle').textContent = brk ? (T.running ? 'Recharging' : MODES[T.mode].label + ' is up next') : (ct ? ct.text : 'Add a task to focus on');
  $('#ieSub').textContent = `${MODES[T.mode].label} · ${Math.round(T.total / 60)} min · round ${T.round % 4 + 1} of 4 · ${stats.shipped} shipped today`;
  const il = T.running ? 'Pause' : (rem < T.total - 1 ? 'Resume' : 'Start'), it = $('#ieToggle');
  if (it.dataset.l !== il) { it.dataset.l = il; it.innerHTML = (T.running ? ICON_PAUSE : ICON_PLAY) + il; }
  $('#ieDone').disabled = !ct;
}

/* ================= boot ================= */
if (T.running && T.endAt <= Date.now()) tComplete(false);
renderTasks(); renderTools(); render(); placeActor(); poke();
setScene(idleScene());
setInterval(tick, 250);
setTimeout(() => {
  const h = new Date().getHours();
  say(pick(h < 5 ? LINES.night : h < 12 ? LINES.morning : h < 17 ? LINES.afternoon : h < 21 ? LINES.evening : LINES.night));
  flash('wave', 1900);
}, 800);
setTimeout(() => islandAlert('Clawd is here', 'Tap me for focus controls', 'HI!'), 1700);
setTimeout(behave, 8000);

try { if ('serviceWorker' in navigator && location.protocol === 'https:' && document.querySelector('link[rel="manifest"]')) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch {}
})();
</script>
</body>
